<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Tracker</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0E1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
/* Navy task tracker: quick-add bar, counts strip, project pills, then a grouped list or a three-column board; each project has its own color. */
:root {
  --bg: #0E1117;
  --surface: #161B24;
  --raised: #1C2230;
  --ink: #E8EAF0;
  --muted: #8A92A5;
  --line: #262D3B;
  --accent: #9DB4FF;
  --accent-soft: #1A2440;
  --done: #43D9A0;
  --done-soft: #0E2A20;
  --late: #FF8A7A;
  --late-soft: #33181A;
  --high: #FF8A7A;
  --pc: #3A4252;
  --normal: #F5C451;
  --low: #6F7A8A;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 10px;
  color-scheme: dark;
}
/* Other themes only swap the base colors; status colors stay the same so meaning doesn't shift. */
:root[data-theme="midnight"] { --bg: #000000; --surface: #0C0C0C; --raised: #151515; --ink: #F2F2F0; --muted: #8E8E8A; --line: #242424; --accent-soft: #141B33; --pc: #333333; }
:root[data-theme="plum"] { --bg: #140F1C; --surface: #1D1628; --raised: #261D34; --ink: #EEE8F5; --muted: #9A8FAE; --line: #30263F; --accent: #C9A8FF; --accent-soft: #2A1E45; --pc: #40354F; }
:root[data-theme="forest"] { --bg: #0D1512; --surface: #14201B; --raised: #1A2A23; --ink: #E6EFEA; --muted: #8AA197; --line: #24352D; --accent: #8FD9B6; --accent-soft: #163327; --pc: #33463D; }
:root[data-theme="mocha"] { --bg: #17120F; --surface: #211A16; --raised: #2B221C; --ink: #F2EAE3; --muted: #A8968A; --line: #362B24; --accent: #F0B989; --accent-soft: #3A2819; --pc: #4A3C33; }
/* Light theme: warm paper. Status colors are darkened so they read on cream, and project tints are mixed light. */
:root[data-theme="paper"] {
  --bg: #F6F1E7; --surface: #FFFDF8; --raised: #EFE7D8; --ink: #2B2620; --muted: #7D7262; --line: #E2D9C7;
  --accent: #B4532A; --accent-soft: #F6E2D6; --done: #2F8A57; --done-soft: #DDEFE2; --late: #B8432C; --late-soft: #F7DDD5;
  --high: #B8432C; --normal: #A8740C; --low: #9A8F7E; --pc: #D6CCB8;
  --font-display: Georgia, "Times New Roman", serif;
  color-scheme: light;
}
:root[data-theme="paper"] .chip.proj, :root[data-theme="paper"] .pill:not(.all):not([aria-pressed="true"]) {
  background: color-mix(in srgb, var(--pc) 20%, #FFFDF8); color: color-mix(in srgb, var(--pc) 55%, #1E1A15);
}
:root[data-theme="paper"] .sw[data-theme="paper"] { border-color: var(--muted); }
:root[data-theme="paper"] .sw[aria-pressed="true"] { border-color: var(--ink); }
:root[data-theme="paper"] dialog::backdrop { background: rgba(43, 38, 32, 0.45); }
:root[data-theme="paper"] .toast { box-shadow: 0 8px 24px rgba(43, 38, 32, 0.25); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 20px; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
h2 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
.sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--done); margin-right: 6px; vertical-align: middle; }
.sync.bad::before { background: var(--late); }
.sync.local::before { background: var(--normal); }
.notice { padding: 10px 14px; border-radius: var(--radius); background: var(--late-soft); border: 1px solid var(--line); font-size: 0.9rem; }

.field { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-width: 0; }
.field:focus { border-color: var(--muted); outline: none; }
select.field { padding-right: 6px; }
.primary { border: 0; background: var(--ink); color: var(--bg); font-weight: 600; border-radius: 8px; padding: 9px 16px; white-space: nowrap; }
.primary:hover { opacity: 0.88; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 13px; font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
.danger { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 9px 14px; color: var(--late); }
.danger:hover { border-color: var(--late); }

form.quick { display: grid; grid-template-columns: minmax(0, 1fr) auto auto minmax(0, 11em) auto; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
form.quick .title { font-size: 1rem; }
@media (max-width: 760px) {
  form.quick { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  form.quick .title, form.quick #q-project { grid-column: 1 / -1; }
  form.quick .primary { grid-column: 1 / -1; }
}

.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.stat { padding: 14px 18px; display: grid; gap: 2px; border-right: 1px solid var(--line); min-width: 0; text-align: left; background: transparent; border-top: 0; border-bottom: 0; border-left: 0; }
.stat:last-child { border-right: 0; }
.stat .value { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em; }
.stat.late .value { color: var(--late); }
.stat.today .value { color: var(--accent); }
.stat.done .value { color: var(--done); }
@media (max-width: 560px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
}

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); font-weight: 600; padding: 6px 14px; border-radius: 999px; font-size: 0.88rem; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
.toolbar .search { flex: 1 1 180px; }
.toolbar select { flex: 0 1 auto; }
.check-label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.88rem; }

/* list view */
.groups { display: grid; gap: 18px; }
.group { display: grid; gap: 6px; }
.group-head { display: flex; align-items: baseline; gap: 8px; }
.group-head .count { font-family: var(--font-num); font-size: 0.8rem; color: var(--muted); }
.group.overdue h2 { color: var(--late); }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px 11px 12px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--pc); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--raised); }
.row .main { min-width: 0; cursor: pointer; border: 0; background: none; text-align: left; padding: 0; display: grid; gap: 3px; }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row.is-done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.row .n { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.due { font-family: var(--font-num); }
.chip.due.late { color: var(--late); background: var(--late-soft); border-color: transparent; }
.chip.due.today { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.doing { color: var(--accent); border-color: var(--accent-soft); }
.chip.proj { background: var(--pc-soft); color: var(--pc-ink); border-color: transparent; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid transparent; background: var(--pc-soft, var(--raised)); color: var(--pc-ink, var(--muted)); border-radius: 999px; padding: 5px 13px; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.pill.all::before { display: none; }
.pill:hover { border-color: var(--pc, var(--muted)); }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pill .n { font-family: var(--font-num); font-weight: 400; font-size: 0.78rem; opacity: .75; }
.pri { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--muted); }
.pri::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--normal); }
.pri.high::before { background: var(--high); }
.pri.low::before { background: var(--low); }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; padding: 0; display: grid; place-items: center; flex: none; }
.tick:hover { border-color: var(--done); }
.tick.on { background: var(--done); border-color: var(--done); }
.tick.on::after { content: ""; width: 6px; height: 11px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0; transform: translate(0, -1px) rotate(45deg); }
.row-actions { display: flex; gap: 4px; }
.icon-btn { border: 1px solid transparent; background: transparent; border-radius: 6px; width: 32px; height: 32px; color: var(--muted); font-size: 1rem; line-height: 1; }
.icon-btn:hover { color: var(--ink); border-color: var(--line); }
.icon-btn.rm:hover { color: var(--late); border-color: var(--late); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

/* board view */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 820px) { .board { grid-template-columns: minmax(0, 1fr); } }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; align-content: start; min-height: 140px; transition: border-color .15s, background .15s; }
.col.over { border-color: var(--accent); background: var(--accent-soft); }
.col-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 4px; }
.col-head .count { font-family: var(--font-num); font-size: 0.8rem; color: var(--muted); }
.card { background: var(--raised); border: 1px solid var(--line); border-left: 4px solid var(--pc); border-radius: 0; padding: 10px 12px; display: grid; gap: 6px; cursor: grab; }
.card:hover { border-color: var(--muted); }
.card.dragging { opacity: 0.4; }
.card .t { font-weight: 600; overflow-wrap: anywhere; }
.card.is-done .t { color: var(--muted); text-decoration: line-through; }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.card .move { display: flex; gap: 2px; }
.card .move .icon-btn { width: 28px; height: 28px; font-size: 0.9rem; }
.col-empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 18px 0; }

/* dialog */
dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.7); }
dialog form { display: grid; gap: 12px; padding: 20px; }
dialog label { display: grid; gap: 5px; }
dialog textarea { resize: vertical; min-height: 80px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dlg-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
.dlg-foot .right { display: flex; gap: 8px; }

/* theme swatches */
.themes { display: flex; gap: 6px; align-items: center; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: var(--sw-bg); padding: 0; display: grid; place-items: center; }
.sw::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sw-ac); }
.sw:hover { border-color: var(--muted); }
.sw[aria-pressed="true"] { border-color: var(--ink); }

/* verse of the day */
.verse { position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 0; padding: 14px 44px 14px 18px; display: grid; gap: 4px; }
.verse p { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.05rem; font-style: italic; line-height: 1.5; text-wrap: pretty; }
.verse .ref { font-size: 0.82rem; color: var(--accent); font-weight: 600; }
.verse .icon-btn { position: absolute; top: 8px; right: 8px; }

/* weekly tasks grid */
.wk-head { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .wk-head { grid-template-columns: minmax(0, 1fr); } }
form.wk-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.wk-legend { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--muted); }
.wk-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: currentColor; }
.grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.wk { border-collapse: separate; border-spacing: 0; width: 100%; }
.wk th, .wk td { padding: 0; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.wk tbody tr:last-child th, .wk tbody tr:last-child td { border-bottom: 0; }
.wk thead th { background: var(--raised); }
.wk th:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); border-right: 1px solid var(--line); }
.wk thead th:first-child { background: var(--raised); z-index: 2; }
.wk .corner { padding: 10px 14px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.wk button { width: 100%; border: 0; background: none; color: inherit; text-align: left; padding: 10px 14px; font: inherit; }
.wk button:hover { background: var(--raised); }
.wk thead button { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.wk tbody th button { font-weight: 600; max-width: 13em; overflow: hidden; text-overflow: ellipsis; }
.wk .c { font-family: var(--font-num); font-size: 0.85rem; min-width: 7.5em; }
.wk .c.fresh, .wk-legend .fresh { color: var(--done); }
.wk .c.stale, .wk-legend .stale { color: var(--normal); }
.wk .c.old, .wk-legend .old { color: var(--late); }
.wk .c.na { color: var(--muted); }
.wk .c.blank { color: var(--pc); }
.w-quick { display: flex; flex-wrap: wrap; gap: 8px; }

/* top tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.wrap > * { min-width: 0; }

/* month end */
.close-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.month-nav { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.month-nav button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; line-height: 1; }
.month-nav button:hover { background: var(--raised); }
.month-nav strong { font-family: var(--font-display); font-weight: 600; min-width: 9.5em; text-align: center; }
.progress { display: grid; gap: 6px; flex: 1 1 220px; max-width: 360px; }
.progress .txt { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--muted); }
.progress .txt b { color: var(--ink); font-family: var(--font-num); font-weight: 500; }
.progress .track { height: 8px; background: var(--raised); border-radius: 99px; overflow: hidden; }
.progress .track i { display: block; height: 100%; background: var(--done); border-radius: 99px; transition: width .3s ease; }
form.add-client { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 11em) auto; gap: 8px; }
@media (max-width: 560px) { form.add-client { grid-template-columns: minmax(0, 1fr) auto; } form.add-client #c-name { grid-column: 1 / -1; } }
#close-list .group + .group { margin-top: 18px; }
#close-list .group-head .count b { color: var(--ink); font-weight: 500; }
.row.client.closed { --pc: var(--done); }
.row.client .st { font-size: 0.82rem; color: var(--muted); }
.row.client.closed .st { color: var(--done); }
.row.client .st { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.row.client .cmain { display: grid; gap: 4px; min-width: 0; }
.note-btn { border: 0; background: none; padding: 0; text-align: left; font-size: 0.82rem; color: var(--muted); justify-self: start; max-width: 100%; }
.note-btn:hover { color: var(--ink); }
.note-btn.has { color: var(--normal); white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.note-btn.has::before { content: "Note: "; font-weight: 600; }
.row.client .row-actions { align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.row.client select { padding: 5px 8px; font-size: 0.85rem; max-width: 9.5em; }
.row.client input[type="date"] { padding: 5px 8px; font-size: 0.85rem; width: 9.6em; }
@media (max-width: 560px) {
  .row.client { row-gap: 8px; }
  .row.client .row-actions { grid-column: 2 / -1; justify-content: flex-start; }
  .row.client .row-actions .rm { margin-left: auto; }
  .row.client select { max-width: 7em; }
  .row.client input[type="date"] { width: 8.8em; }
}

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; display: flex; gap: 14px; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 10; max-width: calc(100vw - 32px); }
.toast button { border: 0; background: none; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tasks</h1>
      <p><span class="sync" id="sync">Connecting…</span></p>
    </div>
    <div class="themes" id="themes" role="group" aria-label="Theme"></div>
  </header>

  <aside class="verse" id="verse" hidden aria-label="Verse of the day">
    <span class="label">Verse of the day</span>
    <p id="verse-text"></p>
    <span class="ref" id="verse-ref"></span>
    <button type="button" class="icon-btn" id="verse-close" aria-label="Hide for today" title="Hide for today">✕</button>
  </aside>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button type="button" role="tab" data-tab="tasks" aria-selected="true">Tasks</button>
    <button type="button" role="tab" data-tab="close" aria-selected="false">Month end</button>
    <button type="button" role="tab" data-tab="weekly" aria-selected="false">Weekly tasks</button>
  </nav>

  <div class="tab" id="tasks-tab">
  <div class="notice" id="notice" hidden></div>

  <form class="quick" id="quick" autocomplete="off">

<script>
(function () {

  // ---------- data ----------

  }

  }
  function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state.tasks.map(taskToRow))); } catch (e) {} }
  function readLocal() { try { return (JSON.parse(localStorage.getItem(LOCAL_KEY)) || []).map(rowToTask); } catch (e) { return []; } }

  var loading = null;

      if (res.error) throw res.error;

      state.syncError = false;

      console.error(err);
      if (!state.loaded && setupHint(err)) { useLocal(); return; }

  function writeFailed(err) {

  }
  function find(id) { return state.tasks.find(function (t) { return t.id === id; }); }

  function addTask(fields) {

  }
  function updateTask(id, patch) {

  }
  function deleteTask(id) {

  }

  }

  // ---------- derived ----------
  function filtered() {

      if (state.project && t.project !== state.project) return false;
      if (state.priority && t.priority !== state.priority) return false;
      if (q && (t.title + " " + t.notes + " " + t.project).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function byUrgency(a, b) {
    var ad = a.due || "9999", bd = b.due || "9999";
    if (ad !== bd) return ad < bd ? -1 : 1;

  }
  // Each project gets its preferred color from its name; if that color is taken, the next free one.
  // Older projects claim first, so colors stay put as new projects are added and match on every device.
  var PROJECT_COLORS = [
    ["#A98BFF", "#2A1F4A", "#C9B8FF"], ["#4FD1A0", "#123528", "#8FE3BE"], ["#F5A54A", "#3A2410", "#FFC98A"],
    ["#FF7EB6", "#3D1628", "#FFB3D3"], ["#5EC8F2", "#0F2E3D", "#A6E2F9"], ["#FF8A6B", "#3B1A12", "#FFBCA8"],
    ["#E58CF0", "#3A1640", "#F3BDF9"], ["#7FA2FF", "#18234A", "#B7CBFF"]
  ];
  var colorMap = {};
  function assignColors() {
    var first = {};
    state.tasks.forEach(function (t) { if (t.project && !(first[t.project] <= t.createdAt)) first[t.project] = t.createdAt; });
    var names = Object.keys(first).sort(function (a, b) { return first[a] - first[b] || a.localeCompare(b); });
    var used = {}, n = PROJECT_COLORS.length;
    colorMap = {};
    names.forEach(function (name, k) {
      var h = 0;
      for (var i = 0; i < name.length; i++) h = (h * 31 + name.toLowerCase().charCodeAt(i)) >>> 0;
      var idx = h % n;

      used[idx] = true;
      colorMap[name] = idx;

  }
  function projectColor(name) { return PROJECT_COLORS[colorMap[name] != null ? colorMap[name] : 0]; }

  function projects() {

  function renderSummary() {

    weeklyWrite(function () { return state.sb.from(WEEKLY_TABLE[kind]).insert({ id: item.id, name: item.name, sort: item.sort }); });
    renderWeekly();
  }
  function renameWeekly(kind, item, name) {
    if (name === item.name) return;
    item.name = name;
    weeklyWrite(function () { return state.sb.from(WEEKLY_TABLE[kind]).update({ name: name }).eq("id", item.id); });
    renderWeekly();
  }
  function removeWeekly(kind, item) {
    if (!confirm("Delete " + item.name + "? Its dates go too.")) return false;
    var list = weeklyList(kind);
    list.splice(list.indexOf(item), 1);
    Object.keys(weekly.cells).forEach(function (k) { var ids = k.split("|"); if (ids[0] === item.id || ids[1] === item.id) delete weekly.cells[k]; });
    weeklyWrite(function () { return state.sb.from(WEEKLY_TABLE[kind]).delete().eq("id", item.id); });
    renderWeekly();
    return true;
  }

  function renderWeekly() {
    var cols = weekly.columns.slice().sort(bySort), rows = weekly.clients.slice().sort(bySort);
    if (!rows.length || !cols.length) {
      $("weekly-grid").replaceChildren(el("div", { class: "empty", text: !weekly.loaded ? "Loading…"
        : !cols.length ? "Add your task columns (like RAMP or Bank feeds) and your clients above." : "Add your clients above." }));
      return;
    }
    var head = el("tr", null, el("th", { scope: "col", class: "corner", text: "Client" }), cols.map(function (col) {
      return el("th", { scope: "col" }, el("button", { type: "button", title: "Rename or delete", onclick: function () { openRename("column", col); } }, col.name));
    }));
    var body = rows.map(function (cl) {
      return el("tr", null,
        el("th", { scope: "row" }, el("button", { type: "button", title: "Rename or delete", onclick: function () { openRename("client", cl); } }, cl.name)),
        cols.map(function (col) {
          var v = weekly.cells[cellKey(cl.id, col.id)], cls = "c", text = "—";
          if (v === "na") { cls += " na"; text = "N/A"; }
          else if (v) {
            var age = -dayDiff(v);
            cls += age <= 7 ? " fresh" : age <= 14 ? " stale" : " old";
            text = new Date(v + "T00:00").toLocaleDateString(undefined, { month: "numeric", day: "numeric", year: "numeric" });
          } else cls += " blank";
          return el("td", null, el("button", { type: "button", class: cls, "aria-label": cl.name + ", " + col.name + ": " + (v ? text : "not set"),
            onclick: function () { openCell(cl, col); } }, text));
        }));
    });
    $("weekly-grid").replaceChildren(el("div", { class: "grid-wrap" },
      el("table", { class: "wk" }, el("thead", null, head), el("tbody", null, body))));
  }

  var cellFor = null;
  function openCell(cl, col) {
    cellFor = { client: cl, column: col };
    var v = weekly.cells[cellKey(cl.id, col.id)];
    $("w-title").textContent = cl.name;
    $("w-sub").textContent = col.name;
    $("w-date").value = v && v !== "na" ? v : todayISO();
    $("wdlg").showModal();
  }
  function finishCell(value) {
    if (cellFor) setCell(cellFor.client, cellFor.column, value);
    $("wdlg").close();
  }
  $("wdlg-form").addEventListener("submit", function (e) { e.preventDefault(); finishCell($("w-date").value); });
  $("w-today").addEventListener("click", function () { finishCell(todayISO()); });
  $("w-na").addEventListener("click", function () { finishCell("na"); });
  $("w-clear").addEventListener("click", function () { finishCell(""); });
  $("w-cancel").addEventListener("click", function () { $("wdlg").close(); });
  $("wdlg").addEventListener("close", function () { cellFor = null; });

  var renameFor = null;
  function openRename(kind, item) {
    renameFor = { kind: kind, item: item };
    $("r-title").textContent = kind === "client" ? "Client" : "Task column";
    $("r-name").value = item.name;
    $("rdlg").showModal();
    $("r-name").select();
  }
  $("rdlg-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("r-name").value.trim();
    if (renameFor && name) renameWeekly(renameFor.kind, renameFor.item, name);
    $("rdlg").close();
  });
  $("r-delete").addEventListener("click", function () { if (renameFor && removeWeekly(renameFor.kind, renameFor.item)) $("rdlg").close(); });
  $("r-cancel").addEventListener("click", function () { $("rdlg").close(); });
  $("rdlg").addEventListener("close", function () { renameFor = null; });

  [["wk-add-client", "wk-client-name", "client"], ["wk-add-col", "wk-col-name", "column"]].forEach(function (f) {
    $(f[0]).addEventListener("submit", function (e) {
      e.preventDefault();
      var name = $(f[1]).value.trim(); if (!name) return;
      addWeekly(f[2], name); $(f[1]).value = ""; $(f[1]).focus();
    });
  });

  // ---------- theme and verse of the day ----------
  var THEMES = [["navy", "Navy", "#0E1117", "#9DB4FF"], ["midnight", "Midnight", "#000000", "#9DB4FF"], ["plum", "Plum", "#140F1C", "#C9A8FF"],
    ["forest", "Forest", "#0D1512", "#8FD9B6"], ["mocha", "Mocha", "#17120F", "#F0B989"], ["paper", "Paper", "#F6F1E7", "#B4532A"]];
  function applyTheme(name) {
    var t = THEMES.filter(function (x) { return x[0] === name; })[0] || THEMES[0];
    state.theme = t[0];
    document.documentElement.setAttribute("data-theme", t[0]);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", t[2]);
    $("themes").querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.theme === t[0])); });
  }
  $("themes").replaceChildren.apply($("themes"), THEMES.map(function (t) {
    return el("button", { type: "button", class: "sw", "data-theme": t[0], title: t[1] + " theme", "aria-label": t[1] + " theme",
      style: "--sw-bg:" + t[2] + ";--sw-ac:" + t[3], onclick: function () { applyTheme(t[0]); savePrefs(); } });
  }));

  // King James Version (public domain). One per day, in order, so everyone sees the same verse.
  var VERSES = [
    ["I can do all things through Christ which strengtheneth me.", "Philippians 4:13"],
    ["Commit thy works unto the LORD, and thy thoughts shall be established.", "Proverbs 16:3"],
    ["This is the day which the LORD hath made; we will rejoice and be glad in it.", "Psalm 118:24"],
    ["Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.", "Joshua 1:9"],
    ["Casting all your care upon him; for he careth for you.", "1 Peter 5:7"],
    ["Trust in the LORD with all thine heart; and lean not unto thine own understanding.", "Proverbs 3:5"],
    ["And whatsoever ye do, do it heartily, as to the Lord, and not unto men.", "Colossians 3:23"],
    ["The LORD is my shepherd; I shall not want.", "Psalm 23:1"],
    ["Let us not be weary in well doing: for in due season we shall reap, if we faint not.", "Galatians 6:9"],
    ["Be still, and know that I am God.", "Psalm 46:10"],
    ["The joy of the LORD is your strength.", "Nehemiah 8:10"],
    ["In all thy ways acknowledge him, and he shall direct thy paths.", "Proverbs 3:6"],
    ["Come unto me, all ye that labour and are heavy laden, and I will give you rest.", "Matthew 11:28"],
    ["Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.", "Philippians 4:6"],
    ["Thy word is a lamp unto my feet, and a light unto my path.", "Psalm 119:105"],
    ["For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.", "2 Timothy 1:7"],
    ["Wait on the LORD: be of good courage, and he shall strengthen thine heart.", "Psalm 27:14"],
    ["The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him.", "Nahum 1:7"],
    ["But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles.", "Isaiah 40:31"],
    ["And we know that all things work together for good to them that love God.", "Romans 8:28"],
    ["Let all your things be done with charity.", "1 Corinthians 16:14"],
    ["The hand of the diligent maketh rich.", "Proverbs 10:4"],
    ["Every good gift and every perfect gift is from above.", "James 1:17"],
    ["His compassions fail not. They are new every morning: great is thy faithfulness.", "Lamentations 3:22–23"],
    ["Fear thou not; for I am with thee: be not dismayed; for I am thy God.", "Isaiah 41:10"],
    ["O give thanks unto the LORD, for he is good: for his mercy endureth for ever.", "Psalm 107:1"],
    ["Peace I leave with you, my peace I give unto you.", "John 14:27"],
    ["Rejoice in the Lord alway: and again I say, Rejoice.", "Philippians 4:4"],
    ["With God all things are possible.", "Matthew 19:26"],
    ["The LORD shall fight for you, and ye shall hold your peace.", "Exodus 14:14"],
    ["Delight thyself also in the LORD; and he shall give thee the desires of thine heart.", "Psalm 37:4"]
  ];
  var VERSE_HIDDEN_KEY = "task-tracker.verse-hidden";
  function showVerse() {
    var day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
    var v = VERSES[day % VERSES.length], hidden = false;
    try { hidden = localStorage.getItem(VERSE_HIDDEN_KEY) === todayISO(); } catch (e) {}
    $("verse-text").textContent = v[0];
    $("verse-ref").textContent = v[1];
    $("verse").hidden = hidden;
  }
  $("verse-close").addEventListener("click", function () {
    try { localStorage.setItem(VERSE_HIDDEN_KEY, todayISO()); } catch (e) {}
    $("verse").hidden = true;
  });

  // ---------- start ----------
  try { var prefs = JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; if (prefs.view === "board") state.view = "board"; state.showDone = !!prefs.showDone; if (prefs.tab === "close" || prefs.tab === "weekly") state.tab = prefs.tab; if (prefs.theme) state.theme = prefs.theme; } catch (e) {}
  $("show-done").checked = state.showDone;
  applyTheme(state.theme);
  showVerse();
  showTab(state.tab);
  render();
  renderClose();
  renderWeekly();
  if (window.supabase) {
    state.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    loadAll().then(function () { if (state.mode === "cloud") subscribeRealtime(); });
    loadClose().then(function () { if (close.mode === "cloud") subscribeClose(); });
    loadWeekly().then(function () { if (weekly.mode === "cloud") subscribeWeekly(); });
  } else {
    useLocal();
    useCloseLocal();
    useWeeklyLocal();
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(function () {});
})();
</script>
</body>
</html>
